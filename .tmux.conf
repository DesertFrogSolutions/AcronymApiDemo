# Set session defaults
set-option -g default-terminal "tmux-256color"
set-option -g default-shell $SHELL

# Source existing tmux configuration if it exists
if-shell "[ -f ~/.tmux.conf ]" "source ~/.tmux.conf"

set-option -g startup_window "test"

# Create the 'database' window
new-window -n "database"
send-keys -t "database" "/usr/local/opt/postgresql/bin/postgres -D /usr/local/var/postgres" C-m

# Create the 'query' window
new-window -n "query"
send-keys -t "query" "start_time=\"$(date -u +%s)\"" C-m
send-keys -t "query" "while [ ! -f \"/tmp/.s.PGSQL.5432\" ] && [ \"$((\$(date -u +%s)-\$start_time))\" -le 5 ] ; do echo -n \".\" ; done" C-m
send-keys -t "query" "PGPASSWORD=<PGPASSWORD> psql --file=./initdb.sql --username=acronymapi --dbname=defaultdb" C-m
send-keys -t "query" "sleep 1" C-m
send-keys -t "query" "PGPASSWORD=<PGPASSWORD> psql --username=acronymapi --dbname=defaultdb" C-m
send-keys -t "query" "ALTER DATABASE defaultdb SET log_statement = 'all';" C-m

# Create the 'backend' window
new-window -n "backend"
send-keys -t "backend" "npm run dev:restify" C-m

# Create the 'test' window
new-window -n "test"
send-keys -t "test" "echo npm run --test_live_node_server=true --test_live_pg_server=true test" C-m
send-keys -t "test" "npm run" C-m
